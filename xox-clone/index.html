<body>
  <div id="app"></div>

  <script>
    // Playlist: song 1 on first interaction, looping until "LET'S GO" is clicked
    // (rather than auto-advancing once it finishes one play-through); "LET'S GO"
    // -> song 2 (loops during loading); VS screen -> music stops (song 3 for the
    // VS screen comes later)
    (function () {
      // Mobile Safari only reliably grants autoplay permission to the audio
      // element created directly inside the very first user-gesture handler —
      // every *subsequent* `new Audio()` (e.g. one per track switch) is treated
      // as a fresh, ungestured playback request and gets silently blocked.
      // Fix: create ONE Audio element on first gesture and reuse it for every
      // track switch (just swap .src), instead of constructing a new one each time.
      var songs = [
        { src: './assets/song2.mp3', loop: true, volume: 0.4 },
        { src: './assets/song-loading.mp3', loop: true }
      ];
      var current = -1;
      var audio = null;
      var started = false;
      var muted = false;

      function ensureAudio() {
        if (!audio) {
          audio = new Audio();
          audio.muted = muted;
        }
        return audio;
      }

      // game mute button also mutes this playlist
      window.addEventListener('xox-mute', function (e) {
        muted = !!e.detail;
        if (audio) audio.muted = muted;
      });
      // game pause button also pauses whatever track is currently playing
      window.addEventListener('xox-pause', function (e) {
        if (!audio) return;
        if (e.detail) {
          audio.pause();
        } else {
          var p = audio.play();
          if (p) p.catch(function (err) { console.warn('playlist resume blocked:', err); });
        }
      });

      function playTrack(src, opts) {
        opts = opts || {};
        var a = ensureAudio();
        a.onended = null;
        a.pause();
        a.src = src;
        a.loop = !!opts.loop;
        a.volume = opts.volume != null ? opts.volume : 1;
        a.currentTime = 0;
        var p = a.play();
        if (p) p.catch(function (err) { console.warn('playlist blocked:', err); });
        return a;
      }
      function playNext() {
        current++;
        if (current >= songs.length) return;
        var song = songs[current];
        var a = playTrack(song.src, { loop: song.loop, volume: song.volume });
        if (!song.loop) a.onended = playNext;
      }
      function stopCurrent() {
        if (audio) { audio.onended = null; audio.pause(); }
      }
      function start() {
        if (!started) { started = true; ensureAudio(); playNext(); }
      }
      // capture phase so the game's own handlers can't block these
      window.addEventListener('keydown', start, true);
      window.addEventListener('mousedown', start, true);
      window.addEventListener('touchstart', start, true);
      // "LET'S GO" button in the game -> skip ahead to song 2 (loops)
      window.addEventListener('xox-letsgo', function () {
        if (current >= 1) return;
        started = true;
        current = 0;
        playNext();
      });
      // VS screen appears -> stop loading song, play the VS song
      window.addEventListener('xox-vs', function () {
        playTrack('./assets/song-vs.mp3', {});
      });
      // Game starts -> play the game song (restarts on each new game)
      var gameLastStart = 0;
      window.addEventListener('xox-game', function () {
        var now = Date.now();
        if (now - gameLastStart < 1500) return; // ignore duplicate triggers
        gameLastStart = now;
        playTrack('./assets/song3.mp3', { volume: 0.4 });
      });

      // read-only debug accessor, used only by the ?audiodebug=1 overlay below
      window.__xoxMusic = {
        state: function () {
          return {
            started: started, current: current, muted: muted,
            audio: audio ? {
              src: audio.src, paused: audio.paused,
              currentTime: +audio.currentTime.toFixed(2), readyState: audio.readyState,
              muted: audio.muted, error: audio.error && audio.error.code
            } : null
          };
        }
      };
    })();
  </script>
  <script>
    // On-device audio diagnostics, opt-in via ?audiodebug=1 (no visible effect otherwise).
    if (location.search.indexOf('audiodebug=1') >= 0) {
      (function () {
        var d = document.createElement('pre');
        d.style.cssText = 'position:fixed;left:0;top:0;z-index:99999;background:#000c;color:#0f0;' +
          'font:10px monospace;padding:4px;max-width:100vw;white-space:pre-wrap;pointer-events:none;';
        document.body.appendChild(d);
        setInterval(function () {
          var a = window.__xoxAudio && window.__xoxAudio.instance;
          var act = navigator.userActivation;
          d.textContent = 'ctx=' + (a ? a.context.state : 'n/a') +
            ' act=' + (act ? (act.isActive + '/' + act.hasBeenActive) : 'n/a') + '\n' +
            JSON.stringify(window.__xoxMusic ? window.__xoxMusic.state() : {}, null, 1);
        }, 400);
      })();
    }
  </script>
  <script>
    // UI cleanup: remove "MEET THE TEAM" button wherever it appears.
    // (The avatar editor screen itself is no longer reachable at all — the
    // state machine's welcome->NEXT transition goes straight to leave_home —
    // so the old auto-click-LET'S-GO skip hack that used to paper over it is
    // gone too.)
    (function () {
      function clean() {
        document.querySelectorAll('#app *').forEach(function (el) {
          if (el.children.length === 0 && (el.textContent || '').trim() === 'MEET THE TEAM') {
            var btn = el.closest('a,button,[role="button"]') || el.parentElement;
            if (btn && btn.style.display !== 'none') btn.style.display = 'none';
          }
        });
      }
      var app = document.getElementById('app');
      new MutationObserver(clean).observe(app, { childList: true, subtree: true });
      clean();
    })();
  </script>
